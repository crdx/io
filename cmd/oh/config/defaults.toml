version = 10

[caps]
default = "rx"

[editor]
command = []

[input]
continue = "yes"

[ui]
streaming = "line"
grouping = ["notice", "reasoning tool", "answer"]
reasoning = "plain"
currency = ""

[ui.theme]
normal = "default"
dim = "#969896"
accent = "#c08050"
user = "#343541"
harness = "#303a43"
status_success = "#4c9a2c"
status_info = "#81a2be"
status_warning = "#cfad00"
status_danger = "#cc6666"
syntax_type = "#f0c674"
syntax_literal = "#b5bd68"
syntax_operator = "#8abeb7"

[tool]
output = "12K"

[permissions]
network = "ask"
lookup = "allow"
fetch = "allow"

[snippets]

[experimental]

[model]
round_robin = []
effort = "high"
fast = false

[provider.ollama]
host = ""

[ports]
hostname = ""

[skills]
include = []
exclude = []

[sandbox]
host_loopback = []
read = []
write = []
exec = []
home = []

[bar.top]
left = [
    { segment = "activity-spinner", idle = "·✦·", frames = ["✦··", "·✦·", "··✦", "··✦", "·✦·", "✦··"], rate = "125ms" },
    { segment = "path-grants", type = "base" },
    { segment = "exposed-ports" },
    { segment = "jobs" },
]
center = [
    { segment = "active-model" },
    { segment = "context-usage" },
]
right = [
    { segment = "scroll-overflow", direction = "up" }
]

[bar.bottom]
left = [
    { segment = "mode-toggle" },
    { segment = "workspace-dir", type = "base" },
]
center = [
    { segment = "subscription-usage" },
]
right = [
    { segment = "session-name", emoji = true },
    { segment = "scroll-overflow", direction = "down" }
]
