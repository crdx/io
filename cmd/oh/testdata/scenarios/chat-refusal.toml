provider = "chat"
model = "deepseek-v4-pro"
effort = "medium"

[first]
prompt = "refuse this request"

[[first.response]]
event = [
    '''{"choices":[{"delta":{"role":"assistant","content":null,"reasoning_content":""}}]}''',
    '''{"choices":[{"delta":{"content":"I cannot help with that."}}]}''',
    '''{"choices":[{"delta":{"content":"","reasoning_content":""},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]

[resume]
prompt = "continue after the first response"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"Resumed."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
