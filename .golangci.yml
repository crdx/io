version: "2"
run:
  allow-serial-runners: true
linters:
  default: all
  disable:
    - bodyclose
    - cyclop
    - depguard
    - dupword
    - err113
    - exhaustive
    - exhaustruct
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomodguard
    - inamedparam
    - ireturn
    - lll
    - maintidx
    - mnd
    - nakedret
    - nestif
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - recvcheck
    - tagalign
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  exclusions:
    paths:
      - "(^|/)node_modules(/|$)"
    rules:
      - path: _test\.go
        linters:
          - gosmopolitan
  settings:
    revive:
      rules:
        - name: exported
    staticcheck:
      checks:
        - all
        - '-ST1000' # Incorrect or missing package comment [https://staticcheck.dev/docs/checks#ST1000]
        - '-ST1003' # Poorly chosen identifier             [https://staticcheck.dev/docs/checks#ST1003]
        - '-ST1006' # Poorly chosen receiver name          [https://staticcheck.dev/docs/checks#ST1006]
formatters:
  enable:
    - gofumpt
    - goimports
