version: "2"
run:
  allow-serial-runners: true
linters:
  default: all
  disable:
    - cyclop
    - dupword
    - err113
    - exhaustruct
    - forbidigo
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - gomodguard
    - godot
    - ireturn
    - lll
    - maintidx
    - mnd
    - nlreturn
    - noinlineerr
    - paralleltest
    - prealloc
    - tagliatelle
    - testpackage
    - wrapcheck
    - wsl
    - wsl_v5
  exclusions:
    paths:
      - "(^|/)node_modules(/|$)"
    rules:
      - path: _test\.go
        linters:
          - gosmopolitan
  settings:
    depguard:
      rules:
        everything:
          deny:
            - pkg: github.com/stretchr/testify
              desc: use stdlib-style tests
            - pkg: github.com/imroc/req
              desc: use net/http
    gocyclo:
      min-complexity: 32
    misspell:
      locale: UK
      ignore-rules:
        - center
        - color
        - organization
        - organizations
        - signaled
        - summarized
    revive:
      rules:
        - name: enforce-repeated-arg-type-style
          arguments: [full]
    staticcheck:
      checks:
        - all
        - '-ST1000' # Incorrect or missing package comment [https://staticcheck.dev/docs/checks#ST1000]
        - '-ST1003' # Poorly chosen identifier             [https://staticcheck.dev/docs/checks#ST1003]
        - '-ST1006' # Poorly chosen receiver name          [https://staticcheck.dev/docs/checks#ST1006]
    varnamelen:
      max-distance: 0
      min-name-length: 2
      ignore-names: [i, x, y]
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
formatters:
  enable:
    - gofumpt
    - goimports
