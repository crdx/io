version: "2"
run:
  allow-serial-runners: true
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupword
    - err113
    - exhaustive
    - exhaustruct
    - forbidigo
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - gomodguard
    - godot
    - inamedparam
    - ireturn
    - lll
    - maintidx
    - mnd
    - nlreturn
    - noinlineerr
    - paralleltest
    - prealloc
    - revive
    - tagalign
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  exclusions:
    paths:
      - "(^|/)node_modules(/|$)"
    rules:
      - path: _test\.go
        linters:
          - gosmopolitan
  settings:
    gocyclo:
      min-complexity: 32
    staticcheck:
      checks:
        - all
        - '-ST1000' # Incorrect or missing package comment [https://staticcheck.dev/docs/checks#ST1000]
        - '-ST1003' # Poorly chosen identifier             [https://staticcheck.dev/docs/checks#ST1003]
        - '-ST1006' # Poorly chosen receiver name          [https://staticcheck.dev/docs/checks#ST1006]
formatters:
  enable:
    - gofumpt
    - goimports
