provider = "codex"
model = ""
effort = ""
get_on_with_it_message = "yes"

[skill]
include = []
exclude = []

[sandbox]
read = []
write = []
exec = []
home = []

[bar.top]
left = [
    { segment = "activity-spinner", idle = "✧·", frames = ["✦·", "·✦", "·✧", "✧·"], rate = "125ms" },
    { segment = "turn-elapsed" },
    { segment = "last-tps" },
    { segment = "turn-count" },
]
center = [
    { segment = "context-usage" },
]
right = [
    { segment = "working-directory", type = "full" },
    { segment = "scroll-overflow", direction = "up" }
]

[bar.bottom]
left = [
    { segment = "mode-toggle" },
]
center = [
    { segment = "active-model" },
]
right = [
    { segment = "current-session" },
    { segment = "scroll-overflow", direction = "down" }
]
