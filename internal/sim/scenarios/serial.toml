# Watch read-only calls batch around a serial write.
#
#   go run ./cmd/simulate --scenario internal/sim/scenarios/serial.toml
#   OH_ENDPOINT_URL=http://localhost:8080 go run ./cmd/oh

model = "gpt-5.6-sol"

strict = true
loop = false

delay = "600ms"
pace = "40ms"

# Seed the file used by later calls.
[[turn]]
think = ["Writing the file the rest of this needs."]
say = "I'll put a file down to work with."

[[turn.call]]
name = "write"
arguments = '{"path":"notes.md","content":"# Notes\n\nOne.\nTwo.\nThree.\n"}'

# Reads batch before the write; the final read waits for it.
[[turn]]
think = ["Reading, then writing, then reading what was written."]
say = "Now to read it, add to it, and read it back."

[[turn.call]]
name = "read"
arguments = '{"path":"notes.md"}'

[[turn.call]]
name = "ls"
arguments = '{"path":"."}'

[[turn.call]]
name = "write"
arguments = '{"path":"notes.md","content":"# Notes\n\nOne.\nTwo.\nThree.\nFour.\n"}'

[[turn.call]]
name = "read"
arguments = '{"path":"notes.md"}'

[[turn]]
say = """
The reads went together, the write waited for them and ran on its own, and the read after it \
waited for the write. The last read has four lines, which it could only have if the write had \
finished first.
"""
